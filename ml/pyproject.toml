[project]
name = "pickleball-ml"
version = "0.1.0"
description = "Computer-vision pipeline for fixed-camera pickleball match footage"
requires-python = ">=3.13,<3.14"
# The base install is what the worker needs for video metadata: OpenCV and
# NumPy, plus the light libraries the pipeline modules import at module level.
# Detection and tracking pull in torch through ultralytics, gigabytes the
# worker image does not need yet, so they are the `tracking` extra; the
# workspace root installs it for development (see the root pyproject.toml).
dependencies = [
    "networkx>=3.3",
    "numpy>=2",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pyarrow>=18",
    "pyyaml>=6",
]

[project.optional-dependencies]
tracking = [
    "lap>=0.5",
    "ultralytics>=8.3",
]

[project.scripts]
pbml = "pickleball_ml.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
