# Backend dependencies for local development.
#
#   docker compose up -d postgres redis      # just the databases (the usual case)
#   docker compose --profile app up -d       # ...plus the API, worker and web app
#
# Postgres and Redis are published on 127.0.0.1 only. Both are unauthenticated
# enough for development that binding them to every interface would put an open
# database on whatever network the laptop is on.
#
# The API, worker and web containers are optional, and off by default. On Apple
# Silicon the worker will eventually need the GPU, which Docker on macOS cannot
# reach, so the intended local setup is: dependencies in Docker, Python and
# Node natively (see README).

name: pickleball

# The three Python services must agree on where the database, the queue and the
# uploads are, so they share one definition rather than three copies that can
# drift. Inside this network Postgres is on its own port 5432; only the host
# publishes it on 5433.
x-backend-env: &backend-env
  PICKLEBALL_DATABASE_URL: postgresql+psycopg://pickleball:pickleball@postgres:5432/pickleball
  PICKLEBALL_REDIS_URL: redis://redis:6379/0
  PICKLEBALL_UPLOAD_DIR: /data/uploads

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pickleball
      POSTGRES_PASSWORD: pickleball
      POSTGRES_DB: pickleball
    ports:
      # 5433, not 5432: a developer machine often already runs PostgreSQL on the
      # default port, and taking it over would be rude. The URL in .env.example
      # points here.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickleball -d pickleball"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Schema changes are migrations, never an application side effect, so the
  # containerised stack needs something to run them. This is a one-shot job:
  # it applies the migrations and exits, and the api and worker wait for it to
  # exit successfully before they start.
  migrate:
    profiles: ["app"]
    # The one place the Python image is built; api and worker reuse the tag,
    # so `up --build` does not build three copies of identical layers.
    image: pickleball-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    environment: *backend-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    image: pickleball-api:dev
    command: ["pbapi", "--host", "0.0.0.0"]
    environment:
      <<: *backend-env
      # Inside the container the app is reached as `api`, so that host must pass
      # the trusted-host check as well.
      PICKLEBALL_TRUSTED_HOSTS: '["localhost","127.0.0.1","api"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      # The image has no curl; Python is what it does have.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build args, not environment: NEXT_PUBLIC_ values are inlined into the
        # browser bundle when the image is built. The browser resolves this, so
        # it is localhost even though the API is `api` on this network.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    profiles: ["app"]
    image: pickleball-api:dev
    # --fork: the container is Linux, where RQ's forking worker is the right
    # one. The macOS default of SimpleWorker exists only because forking breaks
    # there once a CoreFoundation-backed library is loaded.
    command: ["pbworker", "--fork"]
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
