# Alembic configuration for the pickleball API.
#
# Run it from anywhere in the repository by pointing at this file:
#     uv run alembic -c apps/api/alembic.ini upgrade head
#
# The database URL is NOT here: env.py reads it from the application settings,
# so a password never sits in a tracked file and the migrations always target
# the same database the API does.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
